{% extends "base.html" %}
{% load static %}

{% block title %}Create Droplet{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-6">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white shadow rounded-lg">
            <div class="px-6 py-4 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-900">Create New Droplet</h1>
                <p class="text-gray-600">Launch a new DigitalOcean droplet for your class</p>
            </div>
            
            <div class="p-6">
                <form hx-post="{% url 'classroom:droplet_create' %}" 
                      hx-target="#droplet-result" 
                      hx-indicator="#loading"
                      class="space-y-6">
                    {% csrf_token %}
                    
                    <div>
                        <label for="class" class="block text-sm font-medium text-gray-700">Class</label>
                        <select name="class_id" id="class" required
                                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select a class...</option>
                            {% for class in available_classes %}
                                <option value="{{ class.id }}">{{ class.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="count" class="block text-sm font-medium text-gray-700">Number of Droplets</label>
                        <select name="count" id="count" required
                                class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <option value="1">1 Droplet</option>
                            <option value="2">2 Droplets</option>
                            <option value="3">3 Droplets</option>
                        </select>
                    </div>
                    
                    <div class="flex justify-between">
                        <a href="{% url 'classroom:dashboard' %}" 
                           class="bg-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-400 transition-colors">
                            Cancel
                        </a>
                        <button type="submit" 
                                class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                            Create Droplet(s)
                        </button>
                    </div>
                </form>
                
                <div id="loading" class="htmx-indicator mt-4">
                    <div class="flex items-center">
                        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
                        <span class="ml-2 text-gray-600">Creating droplet(s)...</span>
                    </div>
                </div>
                
                <div id="droplet-result" class="mt-6"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
