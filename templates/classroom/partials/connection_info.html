<!-- Connection Info Modal Content -->
<div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
    <div class="sm:flex sm:items-start">
        <div class="mx-auto flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 sm:mx-0 sm:h-10 sm:w-10">
            <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
        </div>
        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
            <h3 class="text-lg leading-6 font-medium text-gray-900">
                Connection Info - {{ droplet.name }}
            </h3>
            <div class="mt-4 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">IP Address</label>
                    <div class="mt-1 flex rounded-md shadow-sm">
                        <input type="text" readonly value="{{ connection_info.ip_address }}" 
                               class="flex-1 block w-full rounded-md border-gray-300 bg-gray-50 sm:text-sm"
                               id="ip-address">
                        <button type="button" onclick="copyToClipboard('ip-address')"
                                class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Copy
                        </button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <div class="mt-1 flex rounded-md shadow-sm">
                        <input type="text" readonly value="{{ connection_info.username }}" 
                               class="flex-1 block w-full rounded-md border-gray-300 bg-gray-50 sm:text-sm"
                               id="username">
                        <button type="button" onclick="copyToClipboard('username')"
                                class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Copy
                        </button>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1 flex rounded-md shadow-sm">
                        <input type="password" readonly value="{{ connection_info.password }}" 
                               class="flex-1 block w-full rounded-md border-gray-300 bg-gray-50 sm:text-sm"
                               id="password">
                        <button type="button" onclick="togglePassword()"
                                class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Show
                        </button>
                        <button type="button" onclick="copyToClipboard('password')"
                                class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Copy
                        </button>
                    </div>
                </div>
                
                {% if connection_info.ssh_command %}
                <div>
                    <label class="block text-sm font-medium text-gray-700">SSH Command</label>
                    <div class="mt-1 flex rounded-md shadow-sm">
                        <input type="text" readonly value="{{ connection_info.ssh_command }}" 
                               class="flex-1 block w-full rounded-md border-gray-300 bg-gray-50 sm:text-sm font-mono"
                               id="ssh-command">
                        <button type="button" onclick="copyToClipboard('ssh-command')"
                                class="ml-2 inline-flex items-center px-3 py-2 border border-gray-300 shadow-sm text-sm leading-4 font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                            Copy
                        </button>
                    </div>
                </div>
                {% endif %}
                
                <div class="bg-yellow-50 border border-yellow-200 rounded-md p-3">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-yellow-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-yellow-700">
                                <strong>Security Note:</strong> Keep your credentials secure. Change the password after first login.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function copyToClipboard(elementId) {
    const element = document.getElementById(elementId);
    element.select();
    element.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(element.value).then(() => {
        // Show brief feedback
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Copied!';
        button.classList.add('bg-green-100', 'text-green-700');
        setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove('bg-green-100', 'text-green-700');
        }, 2000);
    });
}

function togglePassword() {
    const passwordField = document.getElementById('password');
    const button = event.target;
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        button.textContent = 'Hide';
    } else {
        passwordField.type = 'password';
        button.textContent = 'Show';
    }
}
</script>
