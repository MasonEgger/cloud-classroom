<!-- Droplet Card Partial Template for HTMX -->
<div class="px-4 py-4 sm:px-6 hover:bg-gray-50" id="droplet-{{ droplet.id }}">
    <div class="flex items-center justify-between">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <div class="h-10 w-10 rounded-full {% if droplet.ip_addr %}bg-green-500{% else %}bg-gray-400{% endif %} flex items-center justify-center">
                    <svg class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                    </svg>
                </div>
            </div>
            <div class="ml-4">
                <div class="flex items-center">
                    <p class="text-sm font-medium text-gray-900">{{ droplet.name }}</p>
                    <span class="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium {% if droplet.ip_addr %}bg-green-100 text-green-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
                        {% if droplet.ip_addr %}Active{% else %}Starting{% endif %}
                    </span>
                </div>
                <div class="mt-2 flex items-center text-sm text-gray-500">
                    <svg class="flex-shrink-0 mr-1.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-4m-5 0H9m0 0H5m5 0v-4a1 1 0 011-1h2a1 1 0 011 1v4M7 7h10M7 10h6M7 13h8" />
                    </svg>
                    <span>{{ classroom.name }}</span>
                    
                    {% if droplet.ip_addr %}
                    <svg class="flex-shrink-0 ml-4 mr-1.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9" />
                    </svg>
                    <span>{{ droplet.ip_addr }}</span>
                    {% endif %}
                    
                    <svg class="flex-shrink-0 ml-4 mr-1.5 h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>{{ droplet.region|upper }}</span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-2">
            {% if droplet.ip_addr %}
            <!-- Connection Info Button -->
            <button type="button" 
                    hx-get="{% url 'classroom:droplet_connection' droplet.id %}"
                    hx-target="#connection-modal-content"
                    hx-trigger="click"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-md text-sm font-medium"
                    onclick="document.getElementById('connection-modal').classList.remove('hidden')">
                Connect
            </button>
            {% endif %}
            
            <!-- Actions Dropdown -->
            <div class="relative inline-block text-left" x-data="{ open: false }">
                <button @click="open = !open" 
                        class="bg-white hover:bg-gray-50 text-gray-700 border border-gray-300 px-3 py-2 rounded-md text-sm font-medium inline-flex items-center">
                    Actions
                    <svg class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                
                <div x-show="open" 
                     @click.away="open = false"
                     x-transition:enter="transition ease-out duration-100"
                     x-transition:enter-start="transform opacity-0 scale-95"
                     x-transition:enter-end="transform opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-75"
                     x-transition:leave-start="transform opacity-100 scale-100"
                     x-transition:leave-end="transform opacity-0 scale-95"
                     class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none">
                    <div class="py-1">
                        <button hx-post="{% url 'classroom:droplet_action' droplet.id %}"
                                hx-vals='{"action": "power_on"}'
                                hx-target="#droplet-{{ droplet.id }}"
                                hx-swap="outerHTML"
                                class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Power On
                        </button>
                        <button hx-post="{% url 'classroom:droplet_action' droplet.id %}"
                                hx-vals='{"action": "shutdown"}'
                                hx-target="#droplet-{{ droplet.id }}"
                                hx-swap="outerHTML"
                                class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Shutdown
                        </button>
                        <button hx-post="{% url 'classroom:droplet_action' droplet.id %}"
                                hx-vals='{"action": "reboot"}'
                                hx-target="#droplet-{{ droplet.id }}"
                                hx-swap="outerHTML"
                                class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                            Reboot
                        </button>
                        <hr class="my-1">
                        <button hx-post="{% url 'classroom:droplet_action' droplet.id %}"
                                hx-vals='{"action": "delete"}'
                                hx-target="#droplet-{{ droplet.id }}"
                                hx-swap="outerHTML"
                                hx-confirm="Are you sure you want to delete this droplet? This action cannot be undone."
                                class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            Delete Droplet
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
